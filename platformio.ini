; FanBalancer — M5StickC Plus2 (ESP32-PICO-V3-02, 8 MB flash, 2 MB PSRAM)
;
; The stock espressif32 platform has no dedicated "m5stick-c-plus2" board id,
; so this uses the m5stick-c definition with the flash size/partitions of the
; Plus2 overridden below. M5Unified detects the exact board at runtime.

[env:m5stick-c-plus2]
platform = espressif32@^6.9.0
board = m5stick-c
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
framework = arduino
monitor_speed = 115200
upload_speed = 1500000

; The spec requires C++17 — the Arduino core defaults to gnu++11.
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=2

lib_deps =
    m5stack/M5Unified@^0.2.0
    esp32async/ESPAsyncWebServer@^3.6.0
    esp32async/AsyncTCP@^3.3.0
